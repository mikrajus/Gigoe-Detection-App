name: iOS Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Memungkinkan Anda menekan tombol "Run workflow" secara manual di GitHub

jobs:
  build-ios:
    runs-on: macos-14 # Menggunakan server macOS 14 (M1) dengan Xcode 15+

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable' # Menggunakan versi Flutter stabil terbaru

      - name: Install dependencies
        run: flutter pub get

      - name: Force iOS Deployment Target to 15.0
        run: |
          cd ios
          sed -i '' 's/# platform :ios, .*/platform :ios, '\''15.0'\''/g' Podfile || true
          sed -i '' 's/platform :ios, .*/platform :ios, '\''15.0'\''/g' Podfile || true

      - name: Build iOS (Tanpa Code Signing)
        run: flutter build ios --release --no-codesign

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-app
          path: build/ios/iphoneos/*.app
